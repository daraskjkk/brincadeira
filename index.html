<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boas-Vindas!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            margin-top: 20px;
            color: #333;
        }
        .erro {
            color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Digite seu nome</h3>
        <input type="text" id="inputNome" placeholder="Seu nome aqui...">
        <button onclick="cumprimentar()">Entrar</button>
        
        <h2 id="mensagem"></h2>
    </div>

    <script>
        function cumprimentar() {
            const nomeOriginal = document.getElementById('inputNome').value.trim();
            const elementoMensagem = document.getElementById('mensagem');

            // Limpa estilos de erro anteriores
            elementoMensagem.classList.remove('erro');

            // 1. Validação: Campo vazio
            if (!nomeOriginal) {
                elementoMensagem.classList.add('erro');
                elementoMensagem.innerText = "Digite algum nome!";
                return;
            }

            // 2. Validação: Números
            const temNumero = /\d/.test(nomeOriginal);
            if (temNumero) {
                elementoMensagem.classList.add('erro');
                elementoMensagem.innerText = "Erro: Digite apenas letras, sem números!";
                return;
            }

            // 3. Validação: Caracteres especiais (permite letras com acento e espaços)
            const temCaractereEspecial = /[^a-zA-ZáàâãéèêíïóôõöúçñÁÀÂÃÉÈÊÍÏÓÔÕÖÚÇÑ\s]/.test(nomeOriginal);
            if (temCaractereEspecial) {
                elementoMensagem.classList.add('erro');
                elementoMensagem.innerText = "Erro: Não utilize caracteres especiais!";
                return;
            }

            // 4. Processamento do nome
            const nomeChecagem = nomeOriginal.toLowerCase();
            const listaNegra = ['cleber', 'renan'];

            if (listaNegra.includes(nomeChecagem)) {
                elementoMensagem.innerText = `Vai se fuder, ${nomeOriginal}!`;
            } else {
                elementoMensagem.innerText = `Olá, ${nomeOriginal}!`;
            }
        }
    </script>

</body>
</html>
